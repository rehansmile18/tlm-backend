services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # This service's OWN MongoDB — holds ONLY Schedule (operational, site-ops-specific state).
    # Employee/EmployeeGroup/Site/Task/PayPeriodConfig/PayrollCalendar/Punch/EmployeeSiteAssignment
    # are client-owned master data that live in TLM's own database instead (see the `api` service's
    # RULE_REPO_MONGODB_URI below) — this service is their sole public CRUD owner, but doesn't
    # replicate or physically store them itself. Separate database AND separate host port from both
    # TLM's compose stack (127.0.0.1:27017) and tlm-punch-processor's (127.0.0.1:27018), so all
    # three stacks can run side by side on one machine. Bound to localhost only — the database must
    # never be reachable from the network.
    ports:
      - "127.0.0.1:27019:27017"
    environment:
      # MongoDB starts with authentication enabled. Override these with real values via a .env
      # file (or your orchestrator's secrets) before using this anywhere but a local machine.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-tlm_backend_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-local-dev-only-change-me}
      MONGO_INITDB_DATABASE: tlm_backend
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    # Localhost only by default. Put a reverse proxy / TLS terminator in front for real exposure.
    ports:
      - "127.0.0.1:4200:4200"
    # Lets the container reach TLM/tlm-punch-processor instances running directly on the host.
    # Only takes effect on Linux — Docker Desktop (Mac/Windows) already resolves
    # host.docker.internal without this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 4200
      # This compose file is a LOCAL DEV/DEMO stack (NODE_ENV=development), which is why the
      # placeholder secrets below are accepted. Set NODE_ENV=production AND supply real values for
      # JWT_SECRET, PUNCH_PROCESSOR_SERVICE_JWT, PUNCH_INGEST_API_KEY, and Mongo credentials (e.g.
      # in a .env file) to run this as a real deployment — the app refuses to boot on placeholder
      # secrets outside development/test (same resolveSecret() enforcement as TLM/punch-processor).
      NODE_ENV: ${NODE_ENV:-development}
      # This service's OWN database — currently just Schedule.
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-tlm_backend_root}:${MONGO_ROOT_PASSWORD:-local-dev-only-change-me}@mongo:27017/tlm_backend?authSource=admin
      # TLM's OWN MongoDB database — Employee/EmployeeGroup/Site/Task/PayPeriodConfig/
      # PayrollCalendar/Punch/EmployeeSiteAssignment all live there (client-owned master data
      # alongside TLM's own Client/User/Policy collections). The default below assumes TLM's own
      # compose stack is running on this same host with ITS default credentials (tlm_root /
      # local-dev-only-change-me) — override to match your actual TLM Mongo instance otherwise.
      RULE_REPO_MONGODB_URI: ${RULE_REPO_MONGODB_URI:-mongodb://tlm_root:local-dev-only-change-me@host.docker.internal:27017/tlm_rule_repository?authSource=admin}

      # Must be the SAME value as the TLM instance's own JWT_SECRET — this service verifies the
      # identical human-login JWTs TLM issues for every role, it does not mint its own. The
      # fallback below matches TLM's own compose default, so two default-configured local dev
      # stacks already agree with no extra setup.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}

      # Assumes TLM is reachable as a separate compose stack (or bare `npm run dev`) published on
      # the host at localhost:4000 — adjust if your TLM instance lives elsewhere.
      RULE_REPO_BASE_URL: ${RULE_REPO_BASE_URL:-http://host.docker.internal:4000/api/v1}
      # Same assumption for tlm-punch-processor, published at localhost:4100.
      PUNCH_PROCESSOR_BASE_URL: ${PUNCH_PROCESSOR_BASE_URL:-http://host.docker.internal:4100/api/v1}
      # A long-lived JWT for a PLATFORM_ADMIN service-account User seeded in TLM (see README.md /
      # `npm run seed`) — this service's own outbound calls to punch-processor authenticate with
      # it. Must be supplied with a real value for anything beyond local dev — same
      # resolveSecret() enforcement as JWT_SECRET.
      PUNCH_PROCESSOR_SERVICE_JWT: ${PUNCH_PROCESSOR_SERVICE_JWT:-dev-secret-change-me}

      # Shared secret for kiosk/upstream time-clock systems submitting punches directly to this
      # service. Must be supplied with a real value for anything beyond local dev.
      PUNCH_INGEST_API_KEY: ${PUNCH_INGEST_API_KEY:-dev-secret-change-me}

      USER_PROFILE_CACHE_MS: ${USER_PROFILE_CACHE_MS:-60000}
      CORS_ORIGIN: ${CORS_ORIGIN:-}

volumes:
  mongo_data:
